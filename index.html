<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Elite WebGL particle system controlled by hand gestures using MediaPipe and Three.js">
    <title>Happy Birthday Aul!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ── Start screen overlay ────────────────────────────────────── -->
    <div id="start-overlay">
        <button id="start-btn">YUK MULAII!</button>
    </div>

    <!-- ── HUD / UI layer ──────────────────────────────────────────── -->
    <div id="ui-layer">

        <!-- Gesture cheat-sheet -->
        <div class="instructions">
            ✌️ <b>Move Hand:</b> Rotate 3D Model<br>
            🖐 <b>Open Hand:</b> Explode Particles<br>
            ✊ <b>Closed Fist:</b> Black Hole (Attract)<br>
            👐👐 <b>Both Hands Open:</b> Next Model
        </div>

        <!-- Webcam preview with hand-skeleton overlay -->
        <div id="video-container">
            <video id="input-video" playsinline></video>
            <canvas id="output-canvas"></canvas>
        </div>

        <!-- Active gesture label -->
        <div class="gesture-status" id="status-text">Bentarr blom siap...</div>

        <!-- Shape + colour controls -->
        <!-- Buttons start as ??? — JS reveals the active one via updateButtonLabels() -->
        <div class="glass-panel">
            <button onclick="selectShape('sphere')" data-shape="sphere">???</button>
            <button onclick="selectShape('heart')" data-shape="heart">???</button>
            <button onclick="selectShape('galaxy')" data-shape="galaxy">???</button>
            <button onclick="selectShape('saturn')" data-shape="saturn">???</button>
            <button onclick="selectShape('nailong')" data-shape="nailong">???</button>
            <button onclick="selectShape('birthday')" data-shape="birthday">???</button>
            <input type="color" id="baseColor" value="#00d2ff"
                style="height:40px; border:none; border-radius:5px; cursor:pointer;">
        </div>

    </div><!-- /#ui-layer -->

    <!-- ── Third-party libraries ────────────────────────────────────── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <!-- ── App ──────────────────────────────────────────────────────── -->
    <script src="main.js"></script>

</body>

</html>
